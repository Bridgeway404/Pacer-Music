# XcodeGen spec — regenerate the Xcode project with:
#   brew install xcodegen && xcodegen generate --spec ios/project.yml --project ios
# CI does exactly this (.github/workflows/ci.yml), so the .xcodeproj is not
# committed and can never drift from this spec.
name: Pacer
options:
  bundleIdPrefix: com.bridgeway404
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PacerKit:
    path: PacerKit
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Pacer:
    type: application
    platform: iOS
    sources:
      - path: Pacer
    dependencies:
      - package: PacerKit
        product: PacerKit
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bridgeway404.pacer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Pacer/Info.plist
      properties:
        CFBundleDisplayName: Pacer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSMotionUsageDescription: >-
          Pacer measures your running cadence (steps per minute) with the
          motion coprocessor so the music can follow your pace.
        NSAppleMusicUsageDescription: >-
          Pacer connects to Apple Music to play your playlists and pick
          songs that match your running cadence.
        UIBackgroundModes:
          - audio

schemes:
  Pacer:
    build:
      targets:
        Pacer: all
    run:
      config: Debug
    archive:
      config: Release
